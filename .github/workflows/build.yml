name: Build BananaCreate

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Extrair projeto do ZIP
        shell: bash
        run: |
          set -e

          mkdir -p source

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "bananacreate.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERRO: bananacreate.zip não foi encontrado no repositório."
            echo "Arquivos disponíveis:"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "ZIP encontrado: $ZIP_FILE"

          unzip -o "$ZIP_FILE" -d source

          echo "Conteúdo extraído:"
          find source -maxdepth 4 -type f | head -200

      - name: Encontrar projeto Gradle
        shell: bash
        run: |
          set -e

          BUILD_FILE=$(find source -type f -name build.gradle -print -quit)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERRO: nenhum build.gradle foi encontrado dentro do ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado em: $PROJECT_DIR"
          echo "Arquivos Gradle:"
          ls -la "$PROJECT_DIR"

      - name: Conferir versões configuradas
        shell: bash
        run: |
          echo "Verificando build.gradle:"
          grep -nE "create_version|6\\.0\\.6|Registrate|ithundxr" "$PROJECT_DIR/build.gradle" || true

          echo "Verificando gradle.properties:"
          if [ -f "$PROJECT_DIR/gradle.properties" ]; then
            cat "$PROJECT_DIR/gradle.properties"
          else
            echo "AVISO: gradle.properties não encontrado."
          fi

      - name: Compilar mod
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ ! -f gradlew ]; then
            echo "ERRO: gradlew não foi encontrado em $PROJECT_DIR"
            exit 1
          fi

          chmod +x gradlew

          ./gradlew build \
            --no-daemon \
            --max-workers=2 \
            --stacktrace

      - name: Enviar JAR compilado
        uses: actions/upload-artifact@v4
        with:
          name: BananaCreate-JAR
          path: |
            source/**/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
