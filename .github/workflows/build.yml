
name: Build BananaCreate

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extrair projeto
        run: unzip -q bananacreate.zip -d source

      - name: Compilar mod
        run: |
          PROJECT_DIR=$(find source -name build.gradle -type f -print -quit | xargs dirname)
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew build --no-daemon --max-workers=2

      - name: Disponibilizar JAR
        uses: actions/upload-artifact@v4
        with:
          name: BananaCreate-JAR
          path: source/**/build/libs/*.jar
          
